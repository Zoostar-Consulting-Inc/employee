# --- Application specific properties per environment ---
logs:
  base:
    dir: logs

spring:
  datasource:
    driver-class-name: org.h2.Driver
    password: ${employee.datasource.password}
    url: jdbc:h2:./data/employee
    username: spring-boot-local
  jpa:
    defer-datasource-initialization: true
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always
      platform: h2
      schema-locations: classpath*:schema-h2.sql
